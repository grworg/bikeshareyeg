# ── BikeShareYEG — Full Stack ────────────────────────────────
#
# Designed to run alongside other compose stacks on the same host.
# BikeShareYEG's Caddy listens on 127.0.0.1:8443 (plain HTTP).
# The host's main Caddy handles TLS and forwards to us.
#
# Usage:
#   cp .env.example .env          # review & edit
#   docker compose up -d --build  # start everything
#   docker compose logs -f        # watch logs
#
# Architecture:
#   host Caddy (443) → bikeshareyeg-caddy (8443) → web (3000)  HTML/JS
#                                                 → api (8000)  /api/*
#   api → otp (8080)  transit routing
#
# Data:
#   ./data/ is bind-mounted into the api container so station data,
#   overpass cache, overlays, and GTFS files persist across restarts.

services:
  # ── API (FastAPI + Gunicorn) ──────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bikeshareyeg-api
    env_file: .env
    environment:
      - OTP_URL=http://otp:8080
    volumes:
      - ./data:/app/data
    networks:
      - bikeshare
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (Next.js standalone) ─────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    container_name: bikeshareyeg-web
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - bikeshare
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── OpenTripPlanner (transit routing) ─────────────────────
  otp:
    image: docker.io/opentripplanner/opentripplanner:2.6.0
    container_name: bikeshareyeg-otp
    volumes:
      - ./data/otp:/var/opentripplanner
    environment:
      - JAVA_OPTS=-Xmx1536M -Xms512M
    command: ["--load", "--serve"]
    networks:
      - bikeshare
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"query\":\"{__typename}\"}", "http://localhost:8080/otp/routers/default/index/graphql"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Caddy (internal reverse proxy — no TLS) ───────────────
  # The host's main Caddy handles TLS termination and forwards
  # to this container on 127.0.0.1:8443.
  caddy:
    image: caddy:2-alpine
    container_name: bikeshareyeg-caddy
    ports:
      - "127.0.0.1:8443:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - bikeshare
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bikeshare:
    driver: bridge
