services:
  otp:
    image: docker.io/opentripplanner/opentripplanner:2.6.0
    container_name: bikeshareyeg-otp
    ports:
      # Bind to loopback only — not exposed to the internet
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/otp:/var/opentripplanner
    environment:
      # 1.5 G is enough for Edmonton metro; reduce if you add more GTFS feeds
      - JAVA_OPTS=-Xmx1536M -Xms512M
    command: ["--load", "--serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{\"query\":\"{__typename}\"}", "http://localhost:8080/otp/routers/default/index/graphql"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
